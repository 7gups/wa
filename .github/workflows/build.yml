name: Build TWRP-Flashable Zip from Samsung Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to the Samsung firmware .zip/.tar.md5 (e.g. SamFirm/Frija output link)'
        required: true
        type: string
      device_codename:
        description: 'Device codename (e.g. a52sxq, or i9300 for old devices)'
        required: true
        type: string
      patch_with_magisk:
        description: 'Patch boot.img with Magisk (root)'
        required: false
        type: boolean
        default: false
      include_rooted_zip:
        description: 'Also build a separate rooted (Magisk) zip and attach it to the release'
        required: false
        type: boolean
        default: true
      debloat_google_apps:
        description: 'Remove Google apps (GApps) from system/vendor/product'
        required: false
        type: boolean
        default: false
      include_stock_zip:
        description: 'Include the stock .zip with GApps intact alongside the debloated .zip'
        required: false
        type: boolean
        default: true
      buildprop_overrides:
        description: 'Newline-separated key=value pairs to force into build.prop (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip \
            liblz4-tool lz4 \
            brotli \
            zip unzip p7zip-full \
            android-sdk-libsparse-utils \
            e2fsprogs
          # NOTE: the PyPI package is "liblp" (it installs the "lpunpack" CLI command),
          # not a package literally named "lpunpack" — that name does not exist on PyPI.
          # --break-system-packages is required on Ubuntu 24.04 runners (PEP 668).
          pip3 install --user --break-system-packages liblp requests tqdm pyaxmlparser
          # erofs-utils — needed only for newer devices; harmless to build even if unused
          git clone --depth=1 https://github.com/sekaiacg/erofs-utils.git
          cd erofs-utils && make -j"$(nproc)" && sudo make install
          cd ..
      - name: Download firmware
        run: |
          mkdir -p work/firmware
          cd work/firmware
          curl -L -o firmware.zip "${{ inputs.firmware_url }}"
          ls -lh
      - name: Extract firmware archive
        run: |
          cd work/firmware
          # handles both a plain zip wrapper (SamFirm/Frija) and a raw tar.md5
          if unzip -l firmware.zip >/dev/null 2>&1; then
            unzip firmware.zip -d extracted
          else
            mkdir extracted && mv firmware.zip extracted/AP.tar.md5
          fi
          ls -lh extracted
      - name: Untar AP (bootloader/boot/recovery/system/etc.)
        run: |
          cd work/firmware/extracted
          AP_FILE=$(ls AP_*.tar.md5 AP.tar.md5 2>/dev/null | head -n1)
          mkdir -p ap_extracted
          tar -xvf "$AP_FILE" -C ap_extracted
          ls -lh ap_extracted
      - name: Detect firmware generation
        id: detect
        run: |
          cd work/firmware/extracted/ap_extracted
          # Newer devices: dynamic partitions in a single super.img (raw or lz4)
          if ls super.img* >/dev/null 2>&1; then
            echo "layout=dynamic" >> "$GITHUB_OUTPUT"
          # Mid-era devices: separate system.img/vendor.img, often lz4-compressed
          elif ls system.img* vendor.img* >/dev/null 2>&1; then
            echo "layout=legacy_split" >> "$GITHUB_OUTPUT"
          # Old devices: plain ext4 sparse images, no compression, no vendor split
          else
            echo "layout=legacy_plain" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected layout: $(cat "$GITHUB_OUTPUT")"
      - name: Decompress boot-chain images (all generations)
        run: |
          cd work/firmware/extracted/ap_extracted
          mkdir -p ../../raw_images
          for base in boot recovery vendor_boot dtbo dtb; do
            for ext in img.lz4 img; do
              f="${base}.${ext}"
              if [ -f "$f" ]; then
                if [[ "$f" == *.lz4 ]]; then
                  lz4 -d "$f" "../../raw_images/${base}.img"
                else
                  cp "$f" "../../raw_images/${base}.img"
                fi
                break
              fi
            done
          done
          ls -lh ../../raw_images
      - name: Patch boot.img with Magisk (arm64-v8a + armeabi-v7a)
        if: inputs.patch_with_magisk == true
        run: |
          cd work/firmware/raw_images
          if [ ! -f boot.img ]; then
            echo "No boot.img extracted, skipping Magisk patch."
            exit 0
          fi
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | grep browser_download_url | grep '\.apk"' | cut -d '"' -f4 | head -n1)
          curl -L -o magisk.apk "$MAGISK_URL"
          mkdir -p magisk_extract
          unzip -o magisk.apk -d magisk_extract >/dev/null
          # magiskboot/magiskinit are host tools — they run ON the CI runner, so they
          # must match the RUNNER's arch (x86_64), never the target device's arch.
          cp magisk_extract/lib/x86_64/libmagiskboot.so magisk_extract/magiskboot
          cp magisk_extract/lib/x86_64/libmagiskinit.so magisk_extract/magiskinit
          # magisk64/magisk32 are the payload binaries that get embedded in the patched
          # boot image and actually run ON the device — bundling both covers 64-bit-only
          # devices (arm64-v8a) and older 32-bit devices (armeabi-v7a) in one build.
          # boot_patch.sh auto-selects the right one for the target device at flash/boot time.
          cp magisk_extract/lib/arm64-v8a/libmagisk64.so magisk_extract/magisk64
          cp magisk_extract/lib/armeabi-v7a/libmagisk32.so magisk_extract/magisk32
          chmod +x magisk_extract/magiskboot magisk_extract/magiskinit magisk_extract/magisk64 magisk_extract/magisk32
          cp magisk_extract/assets/boot_patch.sh .
          export ASSETDIR="$(pwd)/magisk_extract/assets"
          export PATH="$(pwd)/magisk_extract:$PATH"
          # KEEPVERITY/KEEPFORCEENCRYPT off is the common default for custom-flash setups;
          # flip to true if your device needs stock verity/encryption behavior preserved
          KEEPVERITY=false KEEPFORCEENCRYPT=false sh boot_patch.sh boot.img
          if [ -f new-boot.img ]; then
            # Write the patched image to its own file rather than overwriting boot.img,
            # so the main/stock zips stay unrooted and only the dedicated rooted zip
            # (below) picks this up.
            mv new-boot.img boot-magisk.img
            echo "Magisk patch applied -> boot-magisk.img (boot.img left stock/unrooted)."
          else
            echo "Magisk patch failed, no rooted boot image produced."
          fi
          ls -lh boot.img boot-magisk.img 2>/dev/null || true
      - name: Unpack dynamic partitions (new devices, super.img)
        if: steps.detect.outputs.layout == 'dynamic'
        run: |
          cd work/firmware/extracted/ap_extracted
          SUPER_FILE=$(ls super.img.lz4 super.img 2>/dev/null | head -n1)
          if [[ "$SUPER_FILE" == *.lz4 ]]; then
            lz4 -d "$SUPER_FILE" ../../raw_images/super.img
          else
            cp "$SUPER_FILE" ../../raw_images/super.img
          fi
          cd ../../raw_images
          simg2img super.img super.img.raw 2>/dev/null || mv super.img super.img.raw
          lpunpack super.img.raw unpacked_super
          # normalize: bring unpacked system/vendor/product images up to raw_images/
          find unpacked_super -maxdepth 1 -name '*.img' -exec cp {} . \;
          rm -f super.img.raw
          ls -lh
      - name: Decompress split system/vendor (mid-era devices)
        if: steps.detect.outputs.layout == 'legacy_split'
        run: |
          cd work/firmware/extracted/ap_extracted
          for base in system vendor cache; do
            for ext in img.lz4 img; do
              f="${base}.${ext}"
              if [ -f "$f" ]; then
                if [[ "$f" == *.lz4 ]]; then
                  lz4 -d "$f" "../../raw_images/${base}.img"
                else
                  cp "$f" "../../raw_images/${base}.img"
                fi
                break
              fi
            done
          done
          ls -lh ../../raw_images
      - name: Convert sparse ext4 images to raw (old plain-image devices)
        if: steps.detect.outputs.layout == 'legacy_plain'
        run: |
          cd work/firmware/extracted/ap_extracted
          for base in system cache hidden factoryfs; do
            f="${base}.img"
            if [ -f "$f" ]; then
              # old sparse images need simg2img; plain ext4 ones pass through unchanged
              simg2img "$f" "../../raw_images/${base}.img" 2>/dev/null || cp "$f" "../../raw_images/${base}.img"
            fi
          done
          ls -lh ../../raw_images
      - name: Backup stock partition images (pre-GApps-removal)
        if: inputs.debloat_google_apps == true && inputs.include_stock_zip == true
        run: |
          mkdir -p work/firmware/raw_images_stock
          cp -a work/firmware/raw_images/. work/firmware/raw_images_stock/
          ls -lh work/firmware/raw_images_stock
      - name: Remove Google apps (GApps)
        if: inputs.debloat_google_apps == true
        run: |
          cd work/firmware/raw_images
          # Real Google package IDs (from the app's AndroidManifest.xml), not folder
          # names — folder names vary by OEM build and aren't reliable to match on.
          cat > /tmp/google_pkg_patterns.txt <<'EOF'
          com.google.android.gms
          com.google.android.gsf
          com.android.vending
          com.google.android.apps.messaging
          com.google.android.gm
          com.google.android.apps.maps
          com.google.android.youtube
          com.google.android.googlequicksearchbox
          com.google.android.apps.photos
          com.google.android.calendar
          com.google.android.syncadapters.calendar
          com.google.android.syncadapters.contacts
          com.google.android.backuptransport
          com.google.android.tts
          com.google.android.apps.tachyon
          com.google.android.apps.docs
          com.google.android.apps.wellbeing
          com.google.android.onetimeinitializer
          com.google.android.partnersetup
          com.google.android.printservice.recommendation
          com.google.android.feedback
          com.google.android.ims
          EOF
          cat > /tmp/find_google_pkgs.py <<'PYEOF'
          import sys, os
          from pyaxmlparser import APK
          mount_root = sys.argv[1]
          with open("/tmp/google_pkg_patterns.txt") as f:
              targets = {line.strip() for line in f if line.strip()}
          to_remove = []
          for dirpath, dirnames, filenames in os.walk(mount_root):
              for fn in filenames:
                  if fn.endswith(".apk"):
                      apk_path = os.path.join(dirpath, fn)
                      try:
                          pkg = APK(apk_path).package
                      except Exception:
                          continue
                      if pkg in targets or any(pkg.startswith(t + ".") for t in targets):
                          # remove the app's containing directory (covers base.apk + splits/oat/lib)
                          to_remove.append(dirpath)
                          print(f"MATCH  {pkg}  ->  {dirpath}")
          with open("/tmp/dirs_to_remove.txt", "w") as f:
              for d in sorted(set(to_remove)):
                  f.write(d + "\n")
          PYEOF
          cat > /tmp/patch_setupwizard_flag.sh <<'SHEOF'
          #!/bin/bash
          # Tell the framework to skip the OOBE/setup-wizard gate outright, rather than
          # relying on the SetupWizard app itself to mark setup complete. Without this,
          # a device with Google's SetupWizard removed (or crashing) can get stuck at
          # first boot because nothing ever flips the "setup complete" state.
          PROP_FILE="$1"
          for kv in \
            "ro.setupwizard.mode=DISABLED" \
            "ro.setupwizard.enterprise_mode=0" \
            "ro.setupwizard.rotation_locked=false"; do
            key="${kv%%=*}"
            sed -i "/^${key}=/d" "$PROP_FILE"
            echo "$kv" >> "$PROP_FILE"
          done
          echo "Patched setup-wizard bypass flags into $PROP_FILE"
          SHEOF
          chmod +x /tmp/patch_setupwizard_flag.sh
          for part in system vendor product; do
            IMG="${part}.img"
            [ -f "$IMG" ] || continue
            MNT="mnt_${part}"
            mkdir -p "$MNT"
            FSTYPE=$(file -b "$IMG" 2>/dev/null || echo unknown)
            if echo "$FSTYPE" | grep -qi erofs; then
              dump.erofs --extract="$MNT" "$IMG" >/dev/null 2>&1 || sudo fsck.erofs --extract="$MNT" "$IMG"
              python3 /tmp/find_google_pkgs.py "$MNT"
              while read -r d; do [ -n "$d" ] && rm -rf "$d"; done < /tmp/dirs_to_remove.txt
              if [ "$part" = "system" ]; then
                PROP=$(find "$MNT" -maxdepth 3 -name build.prop | head -n1)
                [ -n "$PROP" ] && bash /tmp/patch_setupwizard_flag.sh "$PROP"
              fi
              mkfs.erofs "$IMG.new" "$MNT" && mv "$IMG.new" "$IMG"
            else
              cp "$IMG" "$IMG.rw"
              sudo mount -o loop,rw "$IMG.rw" "$MNT"
              sudo python3 /tmp/find_google_pkgs.py "$MNT"
              while read -r d; do [ -n "$d" ] && sudo rm -rf "$d"; done < /tmp/dirs_to_remove.txt
              if [ "$part" = "system" ]; then
                PROP=$(sudo find "$MNT" -maxdepth 3 -name build.prop | head -n1)
                [ -n "$PROP" ] && sudo bash /tmp/patch_setupwizard_flag.sh "$PROP"
              fi
              sudo umount "$MNT"
              mv "$IMG.rw" "$IMG"
            fi
            rm -rf "$MNT"
          done
          ls -lh
      - name: Apply build.prop overrides and file overlay
        if: inputs.buildprop_overrides != ''
        run: |
          cd work/firmware/raw_images
          if [ ! -f system.img ]; then
            echo "No system.img, skipping build.prop overrides."
            exit 0
          fi
          cp system.img system.img.rw
          mkdir -p mnt_system
          sudo mount -o loop,rw system.img.rw mnt_system
          PROP=$(sudo find mnt_system -maxdepth 3 -name build.prop | head -n1)
          if [ -n "$PROP" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              key="${line%%=*}"
              sudo sed -i "/^${key}=/d" "$PROP"
              echo "$line" | sudo tee -a "$PROP" >/dev/null
            done <<< "${{ inputs.buildprop_overrides }}"
          else
            echo "No build.prop found on system.img."
          fi
          # optional overlay: anything committed under overlay/system/ in the repo
          # gets copied onto the mounted image before repacking (boot animations, extra apks, etc.)
          if [ -d "$GITHUB_WORKSPACE/overlay/system" ]; then
            sudo cp -r "$GITHUB_WORKSPACE/overlay/system/." mnt_system/
          fi
          sudo umount mnt_system
          mv system.img.rw system.img
          rm -rf mnt_system
      - name: Generate device-aware updater-script
        run: |
          cd work/firmware/raw_images
          echo "# Auto-generated partition dd map for ${{ inputs.device_codename }}" > partitions.list
          for f in *.img; do
            # boot-magisk.img is only for the dedicated rooted zip, never the main/stock partition map
            [ "$f" = "boot-magisk.img" ] && continue
            [ -f "$f" ] && echo "${f%.img}" >> partitions.list
          done
          cat partitions.list
      - name: Assemble TWRP-flashable zip
        run: |
          mkdir -p work/twrp_zip/META-INF/com/google/android
          cp -r work/firmware/raw_images/*.img work/twrp_zip/ 2>/dev/null || true
          rm -f work/twrp_zip/boot-magisk.img
          {
            echo '#!/sbin/sh'
            echo '# Auto-generated flasher — partition-by-name dd, works across old and new layouts'
            echo 'OUTFD=$2'
            echo 'ZIPFILE=$3'
            echo 'ui_print() { echo -e "ui_print $1\nui_print" >&$OUTFD; }'
            echo 'ui_print "Flashing ${{ inputs.device_codename }} stock firmware..."'
            echo 'mkdir -p /tmp/twrp_zip && cd /tmp/twrp_zip'
            echo 'unzip -o "$ZIPFILE" -d /tmp/twrp_zip >/dev/null'
            while read -r part; do
              echo "[ -f /tmp/twrp_zip/${part}.img ] && ui_print 'Flashing ${part}...' && dd if=/tmp/twrp_zip/${part}.img of=/dev/block/bootdevice/by-name/${part} 2>/dev/null || true"
            done < work/firmware/raw_images/partitions.list
            echo 'ui_print "Done. Reboot when ready."'
            echo 'exit 0'
          } > work/twrp_zip/META-INF/com/google/android/update-binary
          chmod 755 work/twrp_zip/META-INF/com/google/android/update-binary
          echo "# placeholder — update-binary does the real work" > work/twrp_zip/META-INF/com/google/android/updater-script
          cd work/twrp_zip
          zip -r9 "../../${{ inputs.device_codename }}-twrp-flashable.zip" .
      - name: Assemble stock (GApps-intact) TWRP-flashable zip
        if: inputs.debloat_google_apps == true && inputs.include_stock_zip == true
        run: |
          mkdir -p work/twrp_zip_stock/META-INF/com/google/android
          cp -r work/firmware/raw_images_stock/*.img work/twrp_zip_stock/ 2>/dev/null || true
          rm -f work/twrp_zip_stock/boot-magisk.img
          {
            echo '#!/sbin/sh'
            echo '# Auto-generated flasher — partition-by-name dd, works across old and new layouts'
            echo 'OUTFD=$2'
            echo 'ZIPFILE=$3'
            echo 'ui_print() { echo -e "ui_print $1\nui_print" >&$OUTFD; }'
            echo 'ui_print "Flashing ${{ inputs.device_codename }} stock firmware (GApps intact)..."'
            echo 'mkdir -p /tmp/twrp_zip_stock && cd /tmp/twrp_zip_stock'
            echo 'unzip -o "$ZIPFILE" -d /tmp/twrp_zip_stock >/dev/null'
            while read -r part; do
              echo "[ -f /tmp/twrp_zip_stock/${part}.img ] && ui_print 'Flashing ${part}...' && dd if=/tmp/twrp_zip_stock/${part}.img of=/dev/block/bootdevice/by-name/${part} 2>/dev/null || true"
            done < work/firmware/raw_images/partitions.list
            echo 'ui_print "Done. Reboot when ready."'
            echo 'exit 0'
          } > work/twrp_zip_stock/META-INF/com/google/android/update-binary
          chmod 755 work/twrp_zip_stock/META-INF/com/google/android/update-binary
          echo "# placeholder — update-binary does the real work" > work/twrp_zip_stock/META-INF/com/google/android/updater-script
          cd work/twrp_zip_stock
          zip -r9 "../../${{ inputs.device_codename }}-twrp-flashable-stock.zip" .
      - name: Assemble rooted (Magisk) TWRP-flashable zip
        if: inputs.patch_with_magisk == true && inputs.include_rooted_zip == true
        run: |
          if [ ! -f work/firmware/raw_images/boot-magisk.img ]; then
            echo "No boot-magisk.img present, skipping rooted zip."
            exit 0
          fi
          mkdir -p work/twrp_zip_rooted/META-INF/com/google/android
          cp -r work/firmware/raw_images/*.img work/twrp_zip_rooted/ 2>/dev/null || true
          # swap in the Magisk-patched boot image in place of the stock one
  

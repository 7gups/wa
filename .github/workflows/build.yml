name: Build TWRP-Flashable Zip from Samsung Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to a SamFirm/Frija-downloaded firmware .zip (the wrapper zip containing AP/BL/CP/CSC .tar.md5 files) or a raw AP .tar.md5 link'
        required: true
        type: string
      device_codename:
        description: 'Device codename (e.g. a52sxq, or i9300 for old devices)'
        required: true
        type: string
      buildprop_overrides:
        description: 'Newline-separated key=value pairs to force into build.prop (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip \
            liblz4-tool lz4 \
            brotli \
            zip unzip p7zip-full \
            android-sdk-libsparse-utils \
            e2fsprogs \
            erofs-utils
          pip3 install --user --break-system-packages liblp requests tqdm pyaxmlparser gdown
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download firmware
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          mkdir -p work/firmware
          cd work/firmware

          if echo "$FIRMWARE_URL" | grep -qE 'drive\.google\.com|drive\.usercontent\.google\.com'; then
            echo "Detected a Google Drive link — using gdown (handles the large-file confirm/cookie flow curl can't)."
            FILE_ID=$(echo "$FIRMWARE_URL" | grep -oP '(?:[?&]id=)\K[^&]+' | head -n1)
            if [ -z "$FILE_ID" ]; then
              FILE_ID=$(echo "$FIRMWARE_URL" | grep -oP '/d/\K[^/]+' | head -n1)
            fi
            if [ -z "$FILE_ID" ]; then
              echo "ERROR: could not extract a Drive file ID from firmware_url."
              exit 1
            fi
            gdown -O firmware.zip "$FILE_ID"
          else
            curl -fL -o firmware.zip "$FIRMWARE_URL"
          fi

          if [ ! -s firmware.zip ]; then
            echo "ERROR: firmware.zip is empty or missing after download."
            exit 1
          fi

          if head -c 200 firmware.zip | grep -qi '<html\|<!DOCTYPE'; then
            echo "ERROR: the download returned an HTML page instead of the firmware file."
            echo "This usually means the source link expired, requires a fresh confirm/session"
            echo "token (common with Google Drive share links), or needs re-generating."
            echo "First 200 bytes of what was actually downloaded:"
            head -c 200 firmware.zip
            exit 1
          fi

          ls -lh firmware.zip
          file firmware.zip

      - name: Extract firmware archive
        run: |
          cd work/firmware
          if unzip -l firmware.zip >/dev/null 2>&1; then
            unzip firmware.zip -d extracted
          else
            mkdir extracted && mv firmware.zip extracted/AP.tar.md5
          fi
          ls -lh extracted

      - name: Untar AP (bootloader/boot/recovery/system/etc.)
        run: |
          cd work/firmware/extracted
          AP_FILE=$(find . -type f \( -iname 'AP_*.tar.md5' -o -iname 'AP.tar.md5' \) | head -n1)
          if [ -z "$AP_FILE" ]; then
            echo "ERROR: no AP_*.tar.md5 file found anywhere in the extracted SamFirm/Frija zip."
            echo "Contents of extracted/:"
            find . -maxdepth 3
            exit 1
          fi
          echo "Found AP file: $AP_FILE"
          mkdir -p ap_extracted
          tar -xvf "$AP_FILE" -C ap_extracted
          echo "Full contents of ap_extracted (recursive):"
          find ap_extracted

      - name: Detect firmware generation
        id: detect
        run: |
          cd work/firmware/extracted/ap_extracted
          if find . -iname 'super.img*' | grep -q .; then
            echo "layout=dynamic" >> "$GITHUB_OUTPUT"
          elif find . -iname 'system.img*' | grep -q . && find . -iname 'vendor.img*' | grep -q .; then
            echo "layout=legacy_split" >> "$GITHUB_OUTPUT"
          else
            echo "layout=legacy_plain" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected layout: $(cat "$GITHUB_OUTPUT")"

      - name: Decompress and collect every partition image
        run: |
          cd work/firmware/extracted/ap_extracted
          mkdir -p ../../raw_images

          find . -type f \( -iname '*.img.lz4' -o -iname '*.img' \) -print0 | while IFS= read -r -d '' path; do
            f=$(basename "$path")
            case "$f" in
              super.img|super.img.lz4) continue ;;
            esac

            if [[ "$f" == *.img.lz4 ]]; then
              base="${f%.img.lz4}"
              [ -f "../../raw_images/${base}.img" ] && continue
              lz4 -d "$path" "../../raw_images/${base}.img.raw"
              simg2img "../../raw_images/${base}.img.raw" "../../raw_images/${base}.img" 2>/dev/null \
                || mv "../../raw_images/${base}.img.raw" "../../raw_images/${base}.img"
              rm -f "../../raw_images/${base}.img.raw"
            else
              base="${f%.img}"
              [ -f "../../raw_images/${base}.img" ] && continue
              simg2img "$path" "../../raw_images/${base}.img" 2>/dev/null || cp "$path" "../../raw_images/${base}.img"
            fi
          done

          echo "Collected partition images:"
          ls -lh ../../raw_images

          if ! ls ../../raw_images/*.img >/dev/null 2>&1; then
            echo "ERROR: no partition images were collected from the extracted AP tar."
            echo "Full tar contents were listed in the previous step's log — check there for"
            echo "what this firmware actually ships (unexpected filenames, nested folders, etc.)."
            exit 1
          fi

      - name: Unpack dynamic partitions (new devices, super.img)
        if: steps.detect.outputs.layout == 'dynamic'
        run: |
          cd work/firmware/extracted/ap_extracted
          SUPER_FILE=$(find . -iname 'super.img.lz4' -o -iname 'super.img' | head -n1)
          if [[ "$SUPER_FILE" == *.lz4 ]]; then
            lz4 -d "$SUPER_FILE" ../../raw_images/super.img
          else
            cp "$SUPER_FILE" ../../raw_images/super.img
          fi
          cd ../../raw_images
          simg2img super.img super.img.raw 2>/dev/null || mv super.img super.img.raw
          lpunpack super.img.raw unpacked_super
          find unpacked_super -maxdepth 1 -name '*.img' -exec cp {} . \;
          rm -f super.img.raw super.img
          rm -rf unpacked_super
          ls -lh

      - name: Apply build.prop overrides and file overlay
        if: inputs.buildprop_overrides != ''
        env:
          BUILDPROP_OVERRIDES: ${{ inputs.buildprop_overrides }}
        run: |
          cd work/firmware/raw_images
          if [ ! -f system.img ]; then
            echo "No system.img, skipping build.prop overrides."
            exit 0
          fi
          cp system.img system.img.rw
          mkdir -p mnt_system
          sudo mount -o loop,rw system.img.rw mnt_system
          PROP=$(sudo find mnt_system -maxdepth 3 -name build.prop | head -n1)
          if [ -n "$PROP" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              key="${line%%=*}"
              sudo sed -i "/^${key}=/d" "$PROP"
              echo "$line" | sudo tee -a "$PROP" >/dev/null
            done <<< "$BUILDPROP_OVERRIDES"
          else
            echo "No build.prop found on system.img."
          fi
          if [ -d "$GITHUB_WORKSPACE/overlay/system" ]; then
            sudo cp -r "$GITHUB_WORKSPACE/overlay/system/." mnt_system/
          fi
          sudo umount mnt_system
          mv system.img.rw system.img
          rm -rf mnt_system

      - name: Generate device-aware updater-script
        env:
          DEVICE_CODENAME: ${{ inputs.device_codename }}
        run: |
          cd work/firmware/raw_images
          # partitions.list is consumed downstream by a plain `while read -r part`,
          # so it must contain ONLY bare partition names, one per line — no header
          # or comment line, since that would get treated as a literal partition
          # name and produce a bogus dd command in the generated flasher script.
          : > partitions.list
          for f in *.img; do
            [ -f "$f" ] && echo "${f%.img}" >> partitions.list
          done
          echo "Detected partitions for $DEVICE_CODENAME:"
          cat partitions.list

      - name: Write shared update-binary generator
        run: |
          cat > /tmp/gen_update_binary.sh <<'GENEOF'
          #!/bin/bash
          set -e
          BIN="$1"
          STAGING_DIR="$2"
          DEVICE_NAME="$3"
          BANNER_SUFFIX="$4"
          PARTITIONS_LIST="$5"

          cat > "$BIN" <<'BINEOF'
          #!/sbin/sh
          OUTFD=$2
          ZIPFILE=$3
          ui_print() { echo -e "ui_print $1\nui_print" >&$OUTFD; }
          ui_print "Flashing @@DEVICE@@ stock firmware@@SUFFIX@@..."
          mkdir -p @@STAGING@@ && cd @@STAGING@@
          unzip -o "$ZIPFILE" -d @@STAGING@@ >/dev/null

          BYNAME=""
          for candidate in /dev/block/bootdevice/by-name /dev/block/by-name /dev/block/platform/*/by-name /dev/block/platform/*/*/by-name; do
            if [ -d "$candidate" ]; then
              BYNAME="$candidate"
              break
            fi
          done
          if [ -z "$BYNAME" ]; then
            ui_print "ERROR: no by-name partition directory found on this device."
            ui_print "This device's SoC uses a partition layout this zip doesn't recognize."
            exit 1
          fi
          ui_print "Using partition path: $BYNAME"
          BINEOF

          sed -i "s/@@DEVICE@@/${DEVICE_NAME}/;s/@@SUFFIX@@/${BANNER_SUFFIX}/g;s#@@STAGING@@#${STAGING_DIR}#g" "$BIN"

          while read -r part; do
            printf '[ -f %s/%s.img ] && ui_print "Flashing %s..." && dd if=%s/%s.img of="$BYNAME"/%s 2>/dev/null || true\n' \
              "$STAGING_DIR" "$part" "$part" "$STAGING_DIR" "$part" "$part" >> "$BIN"
          done < "$PARTITIONS_LIST"

          {
            echo 'ui_print "Done. Reboot when ready."'
            echo 'exit 0'
          } >> "$BIN"

          chmod 755 "$BIN"
          GENEOF
          chmod +x /tmp/gen_update_binary.sh

      - name: Assemble TWRP-flashable zip
        env:
          DEVICE_CODENAME: ${{ inputs.device_codename }}
        run: |
          mkdir -p work/twrp_zip/META-INF/com/google/android
          cp -r work/firmware/raw_images/*.img work/twrp_zip/ 2>/dev/null || true

          BIN=work/twrp_zip/META-INF/com/google/android/update-binary
          /tmp/gen_update_binary.sh "$BIN" /tmp/twrp_zip "$DEVICE_CODENAME" "" work/firmware/raw_images/partitions.list
          echo "# placeholder — update-binary does the real work" > work/twrp_zip/META-INF/com/google/android/updater-script

          cd work/twrp_zip
          zip -r9 "../../${DEVICE_CODENAME}-twrp-flashable.zip" .

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device_codename }}-twrp-flashable
          path: ${{ inputs.device_codename }}-twrp-flashable*.zip
          retention-days: 7

      - name: Package raw .img outputs for release
        env:
          DEVICE_CODENAME: ${{ inputs.device_codename }}
        run: |
          mkdir -p release_imgs
          cp work/firmware/raw_images/*.img release_imgs/ 2>/dev/null || true
          cd release_imgs
          for f in *.img; do
            [ -f "$f" ] && zip -9 "../${DEVICE_CODENAME}-${f%.img}.img.zip" "$f"
          done
          cd ..
          ls -lh *.img.zip 2>/dev/null || echo "No raw images produced."

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.device_codename }}-${{ github.run_number }}"
          name: "${{ inputs.device_codename }} TWRP flashable (build ${{ github.run_number }})"
          body: |
            Auto-built from firmware source: ${{ inputs.firmware_url }}

            Contains:
            - `${{ inputs.device_codename }}-twrp-flashable.zip` — flash from TWRP
            - Individual `.img.zip` files per extracted partition
          files: |
            ${{ inputs.device_codename }}-twrp-flashable*.zip
            *.img.zip
          fail_on_unmatched_files: false

      - name: Stage generated source
        env:
          DEVICE_CODENAME: ${{ inputs.device_codename }}
        run: |
          mkdir -p "devices/${DEVICE_CODENAME}"
          cp work/twrp_zip/META-INF/com/google/android/update-binary "devices/${DEVICE_CODENAME}/update-binary"
          cp work/twrp_zip/META-INF/com/google/android/updater-script "devices/${DEVICE_CODENAME}/updater-script"
          cp work/firmware/raw_images/partitions.list "devices/${DEVICE_CODENAME}/partitions.list"
          cp "${DEVICE_CODENAME}"-twrp-flashable*.zip "devices/${DEVICE_CODENAME}/"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add generated TWRP flashable for ${{ inputs.device_codename }}"
          title: "TWRP flashable: ${{ inputs.device_codename }}"
          body: |
            Auto-generated by the firmware build workflow for `${{ inputs.device_codename }}`.

            Includes:
            - `update-binary` (partition-by-name dd flasher)
            - `updater-script`
            - `partitions.list` (detected partitions for this build)
            - `${{ inputs.device_codename }}-twrp-flashable.zip`
          branch: "twrp-flashable/${{ inputs.device_codename }}"
          base: main
          add-paths: "devices/${{ inputs.device_codename }}/**"
          delete-branch: true
          
